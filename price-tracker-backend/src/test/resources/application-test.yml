spring:
  datasource:
    hikari:
      connection-init-sql: "SET TIME ZONE 'UTC'"
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: price_tracker_test
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: price_tracker_test
